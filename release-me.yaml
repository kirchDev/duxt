# Generated by release-me migrate release-please.
changelog-source: all
# One version line for the layer and its companion layers: a release takes the
# family's highest version plus the bump, and only changed packages release.
versioning: linked
# One release pull request for every changed component, as release-please's was.
release-pull-request: shared
labels:
  pending: 'autorelease: pending'
  tagged: 'autorelease: tagged'
  alpha: false
  beta: false
  rc: false
bump-minor-pre-major: true
components:
  duxt:
    path: packages/duxt
    tag-prefix: duxt@v
    changelog: CHANGELOG.md
    files:
      - path: packages/duxt/package.json
        updater: json
        key: version
  duxt-typesense:
    path: packages/duxt-typesense
    tag-prefix: duxt-typesense@v
    initial-version: 0.1.0
    files:
      - path: packages/duxt-typesense/package.json
        updater: json
        key: version
  duxt-meilisearch:
    path: packages/duxt-meilisearch
    tag-prefix: duxt-meilisearch@v
    initial-version: 0.1.0
    files:
      - path: packages/duxt-meilisearch/package.json
        updater: json
        key: version
