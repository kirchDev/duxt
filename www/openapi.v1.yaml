# The PREVIOUS version of the development site's OpenAPI document.
#
# Deliberately small, and that is the point of it: `openapi.yaml` carries every
# awkward construct, and this one carries none. What it exercises is the other
# thing entirely — a generated section that names its OWN versions, because the
# document beside it is versioned by FILE rather than by tag.
#
# That is how an API is usually kept: `v1` and `v2` sit next to each other in
# one checkout, and neither is a git ref. Without `versions` on the declaration
# the two would be two unrelated sections with two entries in the navbar; with
# it they are one artefact at two versions, with the switcher, the deprecation
# banner and the canonical that every ref-versioned source already gets.
#
# It also makes the distinction this site kept confusing visible: `info.version`
# below is `1.4.0`, while the URL segment is `v1`. A document's own version and
# the version it is PUBLISHED at are two different facts, and a reference that
# shows both has to say which is which.
openapi: 3.1.0

info:
  title: Widgets
  version: 1.4.0
  summary: The previous Widgets API, kept for readers who have not moved yet.
  description: |
    Superseded by **v2**, which renamed `type` to `kind` and started returning
    a cursor instead of a page number.
  contact:
    name: Support
    email: support@example.org
  license:
    name: MIT
    identifier: MIT

servers:
  - url: https://api.example.org/v1
    description: The invented production host.

tags:
  - name: Widgets
    description: Everything that is a widget.

paths:
  /widgets:
    get:
      operationId: listWidgetsV1
      summary: List widgets
      tags: [Widgets]
      description: Returns a page of widgets, oldest first.
      parameters:
        - name: page
          in: query
          description: Which page to return, counting from one.
          schema:
            type: integer
            minimum: 1
            default: 1
      responses:
        '200':
          description: A page of widgets.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Widget'
                  pages:
                    type: integer
                    description: How many pages there are in total.
    post:
      operationId: createWidgetV1
      summary: Create a widget
      tags: [Widgets]
      security:
        - apiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Widget'
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Widget'

components:
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: X-Api-Key
      description: A key from the account page.

  schemas:
    Widget:
      type: object
      title: Widget
      description: One widget, as the previous API saw it.
      required: [id, name, type]
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          minLength: 1
          maxLength: 120
        type:
          type: string
          description: Renamed to `kind` in v2.
          enum: [round, square]
        createdAt:
          type: string
          format: date-time
          readOnly: true

security:
  - apiKey: []
