# The demo API at the version that has NOT HAPPENED YET.
#
# `v3.yaml` with one tag more, and that likeness is the fixture: an unreleased
# line is normally the released one plus what is being added to it, so a reader
# who switches between the two has to be able to see the difference without
# being told where to look. Here it is the **Events** tag below — a streaming
# endpoint that exists on no other version.
#
# `upcoming` is the status this carries, and it is the one that is not about
# age: the banner on these pages tells a reader that what they are reading may
# still change, and offers no upgrade advice, because there is nothing to
# upgrade to. Semver cannot place a branch against a tag, which is why the
# config states it rather than deriving it.
#
# It is a hand-kept copy on purpose. A build step that produced it out of
# `v3.yaml` plus a patch would be a second rendering path for a file whose only
# job is to be read by the one this repository already has.
openapi: 3.1.0

info:
  title: Harbour
  version: 4.0.0-rc.1
  summary: The next Harbour API, still being written.
  description: |
    A **worked example**, and nothing more: no host behind this replies, save
    the one operation that says it does.

    This is the unreleased line. Everything in 3.x is here unchanged; what is
    new is the **Events** tag, and it may still change before it ships.

    Harbour moves consignments through berths. The nouns are made up; the
    *shapes* are the point — this document exists so the reference pages have
    every construct of OpenAPI 3.1 to render, including the ones that are easy
    to leave out.
  contact:
    name: Support
    email: support@example.org
  license:
    name: MIT
    identifier: MIT
  termsOfService: https://example.org/terms

externalDocs:
  url: https://example.org/harbour
  description: Harbour guide

servers:
  - url: https://api.example.org/{stage}
    description: The invented production host.
    variables:
      stage:
        default: v3
        enum: [v1, v2, v3]
        description: Which line of the API to talk to.
  - url: http://localhost:8080
    description: A local process, for trying things out.

security:
  - apiKey: []
  - bearer: []

tags:
  - name: Consignments
    description: |
      Everything that is a consignment — a load of freight, with a reference on
      it and a berth to end up at.
  - name: Vessels
    description: The ships consignments travel on, and what they are carrying.
  - name: Batches
    description: Operations that act on many consignments at once.
    externalDocs:
      url: https://example.org/batching
      description: How batching works
  - name: Events
    description: |
      **New in this line.** A consignment's own history, as it happens, rather
      than a page of it fetched again and again.
  - name: Demo
    description: |
      The one part of this document that is **real**: an endpoint this very
      site answers, so the try-it client on the landing page sends a request
      and gets something back rather than failing against a host that does not
      exist.

      Kept deliberately small — one server, one scheme, two fields — because it
      stands beside a paragraph rather than on a page of its own.

paths:
  /consignments:
    parameters:
      - name: X-Request-Id
        in: header
        description: An identifier echoed back on every response.
        schema:
          type: string
          format: uuid
    get:
      operationId: listConsignments
      summary: List consignments
      tags: [Consignments]
      description: |
        Returns a page of consignments, newest first.

        Paging is by `cursor`; the value comes from the previous response's
        `next` field and is opaque.
      parameters:
        - name: limit
          in: query
          description: How many consignments to return.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: cursor
          in: query
          description: Where to continue from.
          schema:
            type: string
        - name: status
          in: query
          description: Only consignments in these states.
          style: form
          explode: false
          schema:
            type: array
            uniqueItems: true
            items:
              $ref: '#/components/schemas/ConsignmentStatus'
        - name: session
          in: cookie
          description: An optional session, for a personalised order.
          schema:
            type: string
        - name: session
          in: query
          description: |
            The same session, for callers that cannot set the cookie — a page
            cannot, because `Cookie` is a header the browser refuses to let a
            script write.

            Deliberately the same *name* in a second location: OpenAPI
            identifies a parameter by the pair `(name, in)`, so these are two
            parameters, and a reference that keyed its try-it form on the name
            alone would send one box's answer to both.
          schema:
            type: string
      responses:
        '200':
          description: A page of consignments.
          headers:
            X-Request-Id:
              required: true
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Consignment'
                  next:
                    type: [string, 'null']
                    description: The cursor for the following page, if any.
            # A SECOND media type on one response, which the reference has to
            # offer as a choice rather than render twice.
            text/csv:
              schema:
                type: string
                description: The same page, one consignment per line.
              example: |
                id,reference,status
                6f1c…,HB-1042,loading
          links:
            NextPage:
              operationId: listConsignments
              description: The same call again, with `cursor` set from `next`.
        '400':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
    post:
      operationId: createConsignment
      summary: Book a consignment
      tags: [Consignments]
      description: Books one consignment and tells you where it ended up.
      requestBody:
        required: true
        description: The consignment to book.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewConsignment'
            examples:
              minimal:
                summary: The smallest body that works
                value:
                  reference: HB-1042
                  status: booked
              withManifest:
                summary: With the paperwork attached
                value:
                  reference: HB-1042
                  status: booked
                  callbackUrl: https://example.org/hooks/harbour
                  tags: [refrigerated]
          multipart/form-data:
            schema:
              type: object
              properties:
                reference:
                  type: string
                manifest:
                  type: string
                  format: binary
            encoding:
              manifest:
                contentType: application/pdf
      responses:
        '201':
          description: Booked.
          headers:
            Location:
              required: true
              description: Where the new consignment can be read.
              schema:
                type: string
                format: uri
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Consignment'
        '422':
          $ref: '#/components/responses/Problem'
      callbacks:
        consignmentLoaded:
          '{$request.body#/callbackUrl}':
            post:
              summary: Sent once the consignment has been loaded.
              requestBody:
                content:
                  application/json:
                    schema:
                      $ref: '#/components/schemas/Consignment'
              responses:
                '204':
                  description: Acknowledged.

  /consignments/{consignmentId}:
    get:
      operationId: getConsignment
      summary: Read a consignment
      tags: [Consignments]
      parameters:
        - name: consignmentId
          in: path
          description: The consignment's own identifier.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The consignment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Consignment'
        '404':
          $ref: '#/components/responses/Problem'
    patch:
      operationId: updateConsignment
      summary: Update a consignment
      tags: [Consignments]
      description: |
        The one FLAT body in this document, and deliberately so: every other
        request body here carries an array or a map, which the try-it client
        cannot draw as a form. Without this endpoint the form view — and the
        toggle between it and the JSON editor — would never render on this
        site, and a view nothing renders is a view whose failures nobody sees.
        Four properties, one of each kind of box: text, enum, boolean, number.
      parameters:
        - name: consignmentId
          in: path
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsignmentPatch'
      responses:
        '200':
          description: The consignment as it now stands.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Consignment'
        '404':
          $ref: '#/components/responses/Problem'
    delete:
      operationId: cancelConsignment
      summary: Cancel a consignment
      tags: [Consignments]
      deprecated: true
      description: |
        Deprecated. Use the batch endpoint, which takes the same identifiers
        and reports what it could not do.
      parameters:
        - name: consignmentId
          in: path
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Gone.

  /vessels/{imo}/manifest:
    put:
      operationId: replaceManifest
      summary: Replace a vessel's manifest
      tags: [Vessels]
      description: |
        The whole manifest at once — a `PUT`, because half a manifest is not a
        smaller manifest, it is a wrong one.
      parameters:
        - name: imo
          in: path
          description: The vessel's IMO number.
          required: true
          schema:
            type: string
            pattern: '^IMO[0-9]{7}$'
        - name: If-Match
          in: header
          description: The manifest revision you are replacing.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [entries]
              properties:
                entries:
                  type: array
                  items:
                    $ref: '#/components/schemas/ManifestEntry'
      responses:
        '200':
          description: The manifest as it now stands.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ManifestEntry'
        '412':
          $ref: '#/components/responses/Problem'

  /consignments/{consignmentId}/events:
    get:
      operationId: streamConsignmentEvents
      summary: Follow a consignment
      tags: [Events]
      description: |
        Holds the connection open and writes one event per line as the
        consignment moves, in the `text/event-stream` format.

        The response is not a document, which is the interesting part for a
        reference: there is a schema for one *event*, and none for the body as
        a whole.
      parameters:
        - name: consignmentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: Last-Event-ID
          in: header
          description: Resume after the event you last saw.
          schema:
            type: string
      responses:
        '200':
          description: The stream, until you close it.
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/ConsignmentEvent'
        '404':
          $ref: '#/components/responses/Problem'

  /batches:
    post:
      operationId: runBatch
      summary: Run a batch
      tags: [Batches]
      security: []
      description: |
        Takes a list of instructions and applies them in order. This endpoint
        needs no authentication, which is why it takes nothing destructive.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [instructions]
              properties:
                instructions:
                  type: array
                  minItems: 1
                  maxItems: 50
                  items:
                    $ref: '#/components/schemas/Instruction'
      responses:
        '200':
          description: What each instruction did.
          content:
            application/json:
              schema:
                type: array
                items:
                  oneOf:
                    - type: object
                      properties:
                        done: { type: boolean }
                    - $ref: '#/components/schemas/Problem'

  /echo:
    post:
      operationId: echoConsignment
      summary: Book a demo consignment
      tags: [Demo]
      description: |
        Takes a consignment and hands it back with an id and a timestamp,
        exactly as `POST /consignments` would — except that this one is
        answered, by this site.

        Nothing is stored and nothing is checked beyond the token being
        present: it exists so the client on the landing page can be pressed.
      # ITS OWN SERVER, which REPLACES the document's: the two hosts at the top
      # of this file are invented, and a client pointed at them cannot answer.
      # Relative, because this site does not know its own origin at build time
      # and the browser resolves it against wherever the page is served.
      servers:
        - url: /demo
          description: This site.
      # And its own scheme, replacing the document's pair. One field to fill in
      # is what a demo beside a paragraph can ask of a reader; two, one of them
      # a header name nobody has, is a form people bounce off.
      security:
        - bearer: []
      requestBody:
        required: true
        description: The consignment to echo.
        content:
          application/json:
            schema:
              type: object
              required: [reference]
              properties:
                reference:
                  type: string
                  description: What to call it.
                  examples: ['HB-1042']
                mode:
                  type: string
                  description: How it travels.
                  enum: [sea, air]
                  default: sea
      responses:
        '201':
          description: The consignment, as it would have been stored.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  reference: { type: string }
                  mode: { type: string, enum: [sea, air] }
                  createdAt: { type: string, format: date-time }
        '401':
          description: No bearer token was sent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'

webhooks:
  consignmentChanged:
    post:
      summary: A consignment changed
      description: |
        Sent to the address registered for your account whenever a consignment
        you can see changes. Answer with any 2xx.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Consignment'
      responses:
        '200':
          description: Acknowledged.

components:
  securitySchemes:
    apiKey:
      type: apiKey
      name: X-Api-Key
      in: header
      description: A key from the account page.
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: A token obtained from the authorisation server.
      # A value the try-it client fills the field with. duxt's own extension —
      # OpenAPI has no field for it, because a security scheme describes where a
      # credential goes and never what one looks like.
      #
      # Here it is the difference between "I see a client" and "I saw it work":
      # `/echo` answers to any bearer token, and without this a reader has to
      # invent one before the button does anything. It is a demo value in a
      # published file, which is the only kind that belongs in a spec.
      x-duxt-example: demo-token
    oauth:
      type: oauth2
      description: For applications acting on someone else's behalf.
      flows:
        authorizationCode:
          authorizationUrl: https://auth.example.org/authorize
          tokenUrl: https://auth.example.org/token
          scopes:
            'consignments:read': Read consignments
            'consignments:write': Book and change consignments

  responses:
    Problem:
      description: Something went wrong, described the same way every time.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

  schemas:
    Problem:
      type: object
      required: [title, status]
      properties:
        title:
          type: string
          description: A short, human-readable summary.
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: [string, 'null']

    ConsignmentStatus:
      type: string
      description: Where a consignment has got to.
      enum: [booked, loading, sailing, landed, cancelled]

    Consignment:
      type: object
      description: One consignment, as the API sees it.
      required: [id, reference, status]
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        reference:
          type: string
          minLength: 1
          maxLength: 120
        status:
          $ref: '#/components/schemas/ConsignmentStatus'
        createdAt:
          type: string
          format: date-time
          readOnly: true
        parent:
          # A schema that refers to itself, which is the ordinary shape of a
          # tree — a consignment split across two vessels is two consignments
          # under a third — and the one a naive renderer expands until the tab
          # dies.
          $ref: '#/components/schemas/Consignment'
        tags:
          type: array
          uniqueItems: true
          items:
            type: string
        metadata:
          type: object
          additionalProperties:
            type: string

    ConsignmentEvent:
      type: object
      description: One thing that happened to a consignment.
      required: [id, at, status]
      properties:
        id:
          type: string
          description: The value to send back as `Last-Event-ID`.
        at:
          type: string
          format: date-time
        status:
          $ref: '#/components/schemas/ConsignmentStatus'
        berth:
          type: [string, 'null']
          description: Where it is, once it is anywhere.

    ConsignmentPatch:
      type: object
      description: The fields of a consignment that may be changed after booking.
      properties:
        reference:
          type: string
          minLength: 1
          maxLength: 120
        status:
          type: string
          enum: [booked, loading, sailing, landed, cancelled]
        insured:
          type: boolean
          description: Whether the load is covered.
        priority:
          type: integer
          minimum: 1
          maximum: 100
          description: How far up a berth queue this consignment sorts.

    NewConsignment:
      # Folds into one object: a `$ref` plus the fields this endpoint adds is
      # the commonest `allOf` there is.
      allOf:
        - $ref: '#/components/schemas/Consignment'
        - type: object
          properties:
            callbackUrl:
              type: string
              format: uri
              description: Where to send the callback once the load is aboard.

    ManifestEntry:
      type: object
      required: [line, contents]
      properties:
        line:
          type: integer
          minimum: 1
        contents:
          # ALTERNATIVES THAT ARE NOT EXCLUSIVE, and the one composition the
          # document above has no other use for: a line may name a consignment,
          # describe loose cargo, or do both.
          anyOf:
            - type: object
              properties:
                consignmentId:
                  type: string
                  format: uuid
            - type: object
              properties:
                description: { type: string }
                weightKg: { type: number, minimum: 0 }

    Instruction:
      # Does NOT fold: the branches are alternatives, not additions, and a
      # discriminator says which field tells them apart.
      oneOf:
        - $ref: '#/components/schemas/RelabelInstruction'
        - $ref: '#/components/schemas/RetagInstruction'
      discriminator:
        propertyName: op
        mapping:
          relabel: '#/components/schemas/RelabelInstruction'
          retag: '#/components/schemas/RetagInstruction'

    RelabelInstruction:
      type: object
      required: [op, consignmentId, reference]
      properties:
        op:
          const: relabel
        consignmentId:
          type: string
          format: uuid
        reference:
          type: string

    RetagInstruction:
      type: object
      required: [op, consignmentId, tags]
      properties:
        op:
          const: retag
        consignmentId:
          type: string
          format: uuid
        tags:
          type: array
          items:
            type: string
