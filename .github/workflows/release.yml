# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

# release-me cuts the releases, configured in `release-me.yaml`: one shared
# release pull request for every changed package, versioned as one linked
# family. This file carries its own jobs, and this header is the written
# argument CLAUDE.md asks of a workflow that does.
#
# WHY RELEASE-ME IS AN OWN JOB. kirchDev/workflows has no body for it yet; the
# release-please body it replaces lived there. A central `_release-me.yml`
# taking the token and the action pin would let this job become a call again.
#
# WHY THE PUBLISH JOBS ARE OWN BODIES. The central `_publish-npm.yml` publishes
# the repository ROOT: it runs `pnpm publish` where it checks out, and derives a
# prerelease from the newest release tag with a leading `v` stripped. Since the
# monorepo move the root is a private workspace, the layer lives in
# `packages/duxt`, and its tags read `duxt@vX.Y.Z` — so that body would publish
# the wrong thing or nothing. What belongs centrally is a working directory
# input, which is a change to kirchDev/workflows; until that exists, the jobs
# below are what publishes.
#
# THE REGISTRY DECIDES A STABLE PUBLISH, NOT AN OUTPUT. Every workspace package
# under `packages/` that is not private is a candidate, and one is published
# when its `package.json` version has a `<component>@v<version>` tag and npm
# does not have that version yet. A package release-me did not release has
# neither a new tag nor a new version, so nothing unchanged is ever published,
# and a publish that failed halfway is picked up again by the next push to main.
# release-me's own `components` output could gate it, but it would not retry.
name: Release

# npm's trusted publisher for all three packages names THIS FILE: renaming it
# breaks every publish until each package's trusted publisher on npmjs.com is
# moved to the new name. It was `release-please.yml` until the switch to
# release-me, and npm has to be pointed at `release.yml` when that lands.
on:
  push:
    branches:
      - main
  # A release label added to or removed from a release pull request reruns
  # release-me at once instead of on the next push.
  pull_request:
    types: [labeled, unlabeled]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-me:
    name: Release Me
    # A push to main, or a label change on release-me's own release pull
    # request. The label list is release-me.yaml's, spelled out: a workflow
    # condition cannot read the configuration.
    if: >-
      (github.event_name == 'push' && github.ref_name == 'main') ||
      (github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'release-me/') &&
      contains(fromJSON('["autorelease: pending", "autorelease: tagged"]'), github.event.label.name))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      # The Release App, the same identity release-please used: its release
      # pull requests trigger CI, which a GITHUB_TOKEN-opened one would not.
      - name: Fetch Release App PEM from Bitwarden
        uses: bitwarden/sm-action@1238aae8fc64b212641190a9227c8a734ab1a793 # v3.0.1
        with:
          access_token: ${{ secrets.BWS_ACCESS_TOKEN }}
          cloud_region: eu
          secrets: |
            3a3459f0-c986-4ff3-a36b-b4550012d41e > KIRCHDEV_RELEASE_APP_PEM

      - name: Mint Release App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: 'Iv23li3hNqtsZ8fDlwqH'
          private-key: ${{ env.KIRCHDEV_RELEASE_APP_PEM }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          # A label event checks out the base branch, never the merge ref.
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.ref || github.sha }}
          fetch-depth: 0

      - uses: ostendorf-cloud/release-me/action@663cd8eefb3b1979d22371ebffe9ed9f99ed73d5 # v0.3.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          app-slug: ${{ steps.app-token.outputs.app-slug }}

  plan:
    name: Plan the publishes
    needs: release-me
    if: github.event_name == 'push' && github.ref_name == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      stable: ${{ steps.plan.outputs.stable }}
      prerelease: ${{ steps.plan.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The push's `before` commit has to be present to tell which packages
          # this push changed.
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26

      - name: List what to publish
        id: plan
        env:
          BEFORE: ${{ github.event.before }}
          HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          node --input-type=module -e '
            import { execFileSync } from "node:child_process";
            import { appendFileSync, existsSync, readFileSync, readdirSync } from "node:fs";

            const run = (command, args) =>
              execFileSync(command, args, { encoding: "utf8", stdio: ["ignore", "pipe", "ignore"] });
            const succeeds = (command, args) => {
              try { run(command, args); return true; } catch { return false; }
            };

            const packages = readdirSync("packages", { withFileTypes: true })
              .filter((entry) => entry.isDirectory() && existsSync(`packages/${entry.name}/package.json`))
              .map((entry) => {
                const dir = `packages/${entry.name}`;
                const manifest = JSON.parse(readFileSync(`${dir}/package.json`, "utf8"));
                return { dir, name: manifest.name, version: manifest.version, private: manifest.private === true };
              })
              .filter((pkg) => !pkg.private)
              // release-please strips the scope to name the component.
              .map((pkg) => ({ ...pkg, tag: `${pkg.name.replace(/^@[^/]+\//, "")}@v${pkg.version}` }));

            const published = (pkg) => {
              try { return run("npm", ["view", `${pkg.name}@${pkg.version}`, "version"]).trim() !== ""; }
              catch { return false; }
            };

            const stable = packages.filter((pkg) =>
              succeeds("git", ["ls-remote", "--exit-code", "--tags", "origin", `refs/tags/${pkg.tag}`]) &&
              !published(pkg)
            );

            // A prerelease for every package this push changed, and none on the
            // merge of the shared release-me release pull request (branch release-me/main).
            const message = process.env.HEAD_COMMIT_MESSAGE ?? "";
            const releaseCommit = /^Merge pull request #\d+ from [^/\s]+\/release-me\//.test(message);
            const before = process.env.BEFORE ?? "";
            const known = /^[0-9a-f]{40}$/.test(before) && !/^0+$/.test(before) &&
              succeeds("git", ["cat-file", "-e", `${before}^{commit}`]);
            const changed = (pkg) =>
              !known || run("git", ["diff", "--name-only", before, "HEAD", "--", pkg.dir]).trim() !== "";
            const prerelease = releaseCommit ? [] : packages.filter(changed);

            appendFileSync(
              process.env.GITHUB_OUTPUT,
              `stable=${JSON.stringify(stable)}\nprerelease=${JSON.stringify(prerelease)}\n`
            );
            console.log(`stable: ${stable.map((pkg) => pkg.tag).join(", ") || "none"}`);
            console.log(`prerelease: ${prerelease.map((pkg) => pkg.name).join(", ") || "none"}`);
          '

  # BUILT WITHOUT THE PUBLISH IDENTITY. `pnpm install` runs every dependency's
  # lifecycle scripts and `build:app` runs the whole toolchain, so neither
  # belongs in a job holding `id-token: write`, where a compromised package
  # could mint the OIDC token npm trusts. The pack jobs install, verify and
  # `pnpm pack` with a read-only token; the publish jobs hold the identity and
  # run nothing of the repository's — they publish the tarball they are handed.
  pack-release:
    name: Pack ${{ matrix.package.tag }}
    needs: plan
    if: needs.plan.outputs.stable != '' && needs.plan.outputs.stable != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.plan.outputs.stable) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.package.tag }}

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The layer ships source files; build the site that consumes it to verify
      # SSR before anything reaches the registry.
      - name: Build
        run: pnpm build:app

      - name: Pack
        working-directory: ${{ matrix.package.dir }}
        run: pnpm pack --pack-destination "$RUNNER_TEMP/pack"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stable-${{ matrix.package.tag }}
          path: ${{ runner.temp }}/pack/*.tgz
          if-no-files-found: error
          retention-days: 1

  publish-release:
    name: Publish ${{ matrix.package.tag }}
    needs: [plan, pack-release]
    runs-on: ubuntu-latest
    # Deployable from `main` only (kirchDev/infrastructure), and the environment
    # npm's Trusted Publisher is bound to — so a branch copy of this job is
    # refused by GitHub, and its OIDC token by npm.
    environment: npm
    permissions:
      contents: read
      # npm Trusted Publishing (OIDC) and the provenance attestation. No
      # NPM_TOKEN exists in this repo.
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.plan.outputs.stable) }}
    steps:
      # For `packageManager` only: nothing from this checkout is installed or
      # run.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.package.tag }}

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: stable-${{ matrix.package.tag }}
          path: ${{ runner.temp }}/pack

      - name: Publish
        run: |
          set -euo pipefail
          tarball=$(ls "$RUNNER_TEMP"/pack/*.tgz)
          pnpm publish "$tarball" --access public --provenance --no-git-checks --tag latest

  pack-prerelease:
    name: Pack ${{ matrix.package.name }} prerelease
    needs: plan
    if: needs.plan.outputs.prerelease != '' && needs.plan.outputs.prerelease != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.plan.outputs.prerelease) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build:app

      # The same scheme the central body used: the next patch after the version
      # on main, then `dev-main.<run>-<sha>`, under the `dev-main` dist-tag.
      - name: Compute the prerelease version
        working-directory: ${{ matrix.package.dir }}
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          base=$(node -p 'const [a, b, c] = require("./package.json").version.split("-")[0].split(".").map(Number); `${a}.${b}.${c + 1}`')
          npm version --no-git-tag-version --allow-same-version \
            "${base}-dev-main.${RUN_NUMBER}-${GITHUB_SHA::7}"

      - name: Pack
        working-directory: ${{ matrix.package.dir }}
        run: pnpm pack --pack-destination "$RUNNER_TEMP/pack"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: prerelease-${{ matrix.package.tag }}
          path: ${{ runner.temp }}/pack/*.tgz
          if-no-files-found: error
          retention-days: 1

  publish-prerelease:
    name: Publish ${{ matrix.package.name }} prerelease
    needs: [plan, pack-prerelease]
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.plan.outputs.prerelease) }}
    steps:
      # For `packageManager` only: nothing from this checkout is installed or
      # run.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: prerelease-${{ matrix.package.tag }}
          path: ${{ runner.temp }}/pack

      - name: Publish
        run: |
          set -euo pipefail
          tarball=$(ls "$RUNNER_TEMP"/pack/*.tgz)
          pnpm publish "$tarball" --access public --provenance --no-git-checks --tag dev-main
