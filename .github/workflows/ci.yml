# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

# The checks come from this repo's own `check` script in package.json — adding
# one there is enough, no workflow change needed.
name: CI

on:
  pull_request:
    branches:
      - main
      - dev
    types: [opened, synchronize, reopened, ready_for_review]

# NO `paths-ignore`, AND THAT IS THE POINT OF THE GATE. A change touching only
# prose cannot break a lint — but a workflow that does not TRIGGER reports no
# check at all, and a required check that never reports does not pass the merge,
# it blocks it forever. `CI / Gate` is meant to be a required check, so this
# workflow has to run on every pull request, including a README-only one.

permissions:
  contents: read

jobs:
  check:
    name: CI
    uses: kirchDev/workflows/.github/workflows/_ci-check.yml@69bab03ff0e8b0ac3791cd6dbec97a4a8328c433 # v0.11.0
    # THE REMOTE SOURCES, CACHED BETWEEN RUNS. A site reading other repositories
    # re-cloned every one of them on every pull request. The body restores and
    # saves the cache itself, because a job beside this call runs on another
    # runner and could never hand the directory to the checks.
    #
    # THE SAME COMMAND `deploy.yml` RUNS, and it has to stay the same: a hit
    # across pull requests comes from the default branch's writer, so the key
    # and the path list must agree. The command answers `cacheable=false` for a
    # private or authenticated source, and the body then caches nothing.
    with:
      remote-source-cache-command: node ./bin/duxt-cache-key.mjs --root www --github >> "$GITHUB_OUTPUT"
