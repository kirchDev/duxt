# pnpm settings. Moved here from .npmrc: pnpm 10+ reads only auth/registry
# settings from .npmrc — every other setting must live in this file.

# Automatically install missing peer dependencies when possible.
autoInstallPeers: true

# Require packages to be at least 4320 minutes (3 days) old before install.
minimumReleaseAge: 4320

# Prefer using the lockfile as-is for deterministic installs.
preferFrozenLockfile: true

# Verify package integrity in the store before linking.
verifyStoreIntegrity: true

# Do not fail installs on peer dependency conflicts.
strictPeerDependencies: false

# Use pnpm's isolated node_modules linker layout.
nodeLinker: isolated

# Package-manager enforcement is deliberately left unset. pnpm 10's
# packageManagerStrict / packageManagerStrictVersion were replaced in pnpm 11 by
# pmOnFail (download | error | warn | ignore), whose default is `download`.
# Enforcement stays on under that default — pnpm errors out for a foreign package
# manager (shouldError covers `download` as well as `error`) — and `download`
# additionally fetches the pnpm version pinned in package.json's packageManager
# field, which is the closest match to the old packageManagerStrict: true plus
# packageManagerStrictVersion: false. Setting pmOnFail here would only weaken that.

# The published packages live in packages/, the sites that develop them in apps/
# — see CLAUDE.md. The root is not a package of its own: it carries the
# workspace and the meta layer. apps/www depends on the layer by name rather
# than by path, the same way a consumer installs it, exports map included.
packages:
  - packages/*
  - apps/*

# The layer's dependencies, hoisted to the workspace root so apps/www resolves
# them exactly as it did while the root WAS the layer. The site builds the
# layer's code from its own directory and resolves bare imports upwards from
# there; these are dependencies of packages/duxt, not of the site, and without
# a copy at the root two things broke that nothing about the move meant to
# change. `nuxt typecheck` lost the packages its generated declarations import
# by name, so every Content query typed as `never`; and the Workers build,
# which bundles dependencies rather than externalising them, could no longer
# resolve `shiki` and died on its `onig.wasm`.
#
# THE LIST IS A MEASUREMENT, not a guess: every direct dependency of
# packages/duxt that resolved from www/ before the move. The six that did not
# resolve then (@nuxtjs/color-mode, @nuxtjs/mcp-toolkit, @nuxtjs/sitemap,
# shadcn-nuxt, tw-animate-css, vue-sonner) stay unhoisted, so the site sees
# neither more nor less than it did. A dependency added to the layer that the
# site has to reach belongs here too.
publicHoistPattern:
  - '@codemirror/autocomplete'
  - '@codemirror/commands'
  - '@codemirror/lang-json'
  - '@codemirror/language'
  - '@codemirror/lint'
  - '@codemirror/state'
  - '@codemirror/view'
  - '@iconify-json/flag'
  - '@iconify-json/lucide'
  - '@iconify-json/simple-icons'
  - '@lezer/highlight'
  - '@lucide/vue'
  - '@nuxt/content'
  - '@nuxt/icon'
  - '@nuxt/image'
  - '@nuxtjs/i18n'
  - '@nuxtjs/seo'
  - '@resvg/resvg-js'
  - '@shikijs/transformers'
  - '@tailwindcss/vite'
  - '@vueuse/core'
  - citty
  - class-variance-authority
  - clsx
  - fuse.js
  - jiti
  - mermaid
  - reka-ui
  - satori
  - shiki
  - tailwind-merge
  - tailwindcss
  - yaml
  - zod

# Vue declares `typescript` as an optional peer with range `*`, and with
# autoInstallPeers any package that does not pin it can pull in TypeScript 7 —
# which vue-tsc cannot run on (it resolves typescript/lib/tsc, a subpath 7 no
# longer exports), taking down `pnpm typecheck:app`. Pin the whole graph to the
# 6 line the repo targets; gildstone carries the same override for the same
# reason. Revisit when vue-tsc supports 7.
overrides:
  typescript: ^6.0.3

# Build scripts are blocked by default; each one is answered explicitly here.
# esbuild places a platform binary in its postinstall and does not run without
# it. better-sqlite3 arrives transitively through @nuxt/content and db0 and
# would compile a native addon via node-gyp — refused, not merely unapproved:
# Content runs on Node 24's built-in node:sqlite (content.experimental
# .sqliteConnector: 'native'), so nothing here needs the addon.
allowBuilds:
  better-sqlite3: false
  # Arrives transitively with `agents` (the Cloudflare MCP handler). Its
  # postinstall only prints a funding banner — nothing is compiled and nothing
  # is placed, so the package works exactly the same without it.
  core-js-pure: false
  esbuild: true
  # reka-ui pulls vue-demi, whose postinstall picks the Vue 2/3 shim. gildstone
  # allows it for the same reason.
  vue-demi: true
  # wrangler's local runtime. Its postinstall places the workerd binary that
  # `pnpm --filter www preview:cf` (miniflare) runs the built Worker on. The
  # deploy itself never starts it — but a preview that cannot run is a preview
  # nobody uses, and refusing the build only moves the failure to the first
  # person who tries.
  workerd: true
